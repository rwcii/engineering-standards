# promotion-source (WDR 010, Decisions 3 and 5): a pull request into main comes from this
# repository's develop. It runs on pull_request_target, so the workflow and the script come from
# the base branch, never from the pull request: a pull request cannot change the check that
# judges it. It checks out the base branch only and runs no code from the pull request.
# The job name is a required status context; renaming it breaks the merge gate.
name: promotion-source

on:
  pull_request_target:
    branches: [develop, main]
    # edited covers a pull request whose base is changed, such as one retargeted to main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: A pull request into main comes from this repository's develop
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: bash scripts/check-promotion-source.sh "$BASE" "$HEAD_REF" "$HEAD_REPO" "$THIS_REPO"
